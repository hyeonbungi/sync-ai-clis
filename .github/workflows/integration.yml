# Layers 2–3 (SPEC §8.2/§8.3): REAL installs and updates, only on disposable
# infrastructure — Docker containers and GitHub-hosted runners (never the dev
# machine, SPEC §8.5). Network-dependent and slower, so it runs on manual
# dispatch and a weekly schedule instead of every push (macOS minutes bill
# 10x on private repos).
#
# Windows runners use Windows Server. Match the CLI's build>=22000 gate:
# Server 2022 skips; Server 2025 attempts the confirmed PowerShell installer.
# A Server success does not establish support for every Windows 11 system.
name: Integration

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Integration jobs to run (use windows for focused verification)"
        default: all
        type: choice
        options: [all, windows]
      matrix:
        description: "Linux docker matrix size (smoke | full)"
        default: smoke
        type: choice
        options: [smoke, full]
      tools:
        description: "Tools for the Linux docker legs"
        default: claude,antigravity
        type: string
  schedule:
    - cron: "37 18 * * 5" # weekly, Friday 18:37 UTC

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-docker:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    name: linux docker (${{ inputs.matrix || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run real install/update matrix in containers
        # Workflow inputs flow through env (never interpolated into the
        # shell) — the script and the CLI both validate their values.
        env:
          MATRIX: ${{ inputs.matrix || 'full' }}
          TOOLS: ${{ inputs.tools || 'claude,antigravity' }}
        run: docker/run-matrix.sh

  linux-musl:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    name: linux musl (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # upstream installers may not ship musl builds
    steps:
      - uses: actions/checkout@v5
      - run: RUN_MUSL=1 MATRIX=smoke docker/run-matrix.sh

  macos-real:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    name: macos real channels (5 tools)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo build --release
      - name: Pre-seed brew cask and npm channels
        run: |
          brew install --cask codex
          npm install -g @google/gemini-cli
      - name: Real sync — natives install, brew/npm channels update
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./target/release/sync-ai-clis --yes --only claude,codex,gemini,kiro,antigravity --json > result.json
          cat result.json
          jq -e 'length == 5 and all(.[]; .result == "ok")' result.json
      - name: Re-verify every tool runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          codex --version
          gemini --version
          kiro-cli --version
          agy --version
          ./target/release/sync-ai-clis list

  windows-real:
    name: windows real channels (kiro build gate)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Record Windows build using the CLI's version source
        shell: pwsh
        run: |
          $version = cmd /c ver
          $build = 0 # Unknown build: the CLI also treats this as unsupported.
          if ($version -match '\[Version \d+\.\d+\.(\d+)[^\]]*\]') {
            $build = [uint32]$Matches[1]
          }
          Write-Host "Windows build: $build"
          "KIRO_WINDOWS_BUILD=$build" >> $env:GITHUB_ENV
      - name: Real sync — native PowerShell installers, validate Kiro build gate
        shell: bash
        run: |
          ./target/release/sync-ai-clis.exe --yes --only claude,antigravity,kiro --json > result.json
          cat result.json
          jq -e --argjson windows_build "$KIRO_WINDOWS_BUILD" -f .github/scripts/windows-results.jq result.json
      - name: Verify Kiro runs after a successful install
        shell: pwsh
        run: |
          $kiro = @(Get-Content -Raw result.json | ConvertFrom-Json | Where-Object id -eq 'kiro')
          if ($kiro.Count -ne 1) { throw 'Expected exactly one Kiro result' }
          if ($kiro[0].result -eq 'skip') {
            Write-Host "Kiro skipped: $($kiro[0].reason)"
          } else {
            # MSI updates registry PATH, not the runner process environment.
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath;$env:Path"
            $command = Get-Command kiro-cli -CommandType Application -ErrorAction Stop
            $version = & $command.Source --version
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($version -join "`n"))) {
              throw 'Kiro installed but --version did not succeed'
            }
            Write-Host ($version -join "`n")
          }
      - name: Verify antigravity at its known install dir
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\agy\bin\agy.exe" --version
      - name: Locate claude install dir (informative — backlog #3)
        shell: pwsh
        continue-on-error: true
        run: |
          $candidate = "$env:USERPROFILE\.local\bin\claude.exe"
          if (Test-Path $candidate) {
            Write-Host "claude found at $candidate"
            & $candidate --version
          } else {
            Write-Host "claude not at $candidate — listing candidates for backlog #3"
            Get-ChildItem -Path "$env:USERPROFILE\.local" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
            Get-ChildItem -Path "$env:LOCALAPPDATA" -Directory -ErrorAction SilentlyContinue | Select-Object Name -First 30
          }
